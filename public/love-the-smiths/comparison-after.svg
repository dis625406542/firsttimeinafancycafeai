<text x="48" y="646" font-family="Arial, sans-serif" font-size="14" letter-spacing="1.5" fill="#cfb3a2">ORIGINAL ILLUSTRATIONS · NOT A FILM STILL AND NOT A CUSTOMER RESULT</text>
