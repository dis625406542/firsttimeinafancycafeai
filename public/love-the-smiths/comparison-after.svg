<circle cx="-56" cy="0" r="40" fill="#e8b89a"/>
<circle cx="56" cy="0" r="40" fill="#f0c4a8"/>
<path d="M0-12s-18-11-18-23c0-8 6-13 12-13 3 0 6 2 6 4 0-2 3-4 6-4 6 0 12 5 12 13 0 12-18 23-18 23Z" fill="#f07a68"/>
<path d="M-74 26c8 8 20 8 28 0M42 26c8 8 20 8 28 0" stroke="#8a4a45" stroke-width="5" fill="none" stroke-linecap="round"/>
