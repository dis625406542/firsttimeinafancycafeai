<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Original illustration: four-beat elevator storyboard</title>
<desc id="desc">Headphones, a sideways glance, the line, and a shared smile. Illustrations, not customer results.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2a1813"/><stop offset="1" stop-color="#1b0f0b"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a2e24"/><stop offset="1" stop-color="#332018"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="24" fill="url(#bg)"/>
<text x="48" y="66" font-family="Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="3" fill="#e0b56f">THE ELEVATOR MEET-CUTE · FOUR BEATS</text>
<g font-family="Georgia, serif" fill="#fff4e8">
<g>
<rect x="48" y="96" width="536" height="242" rx="18" fill="url(#panel)" stroke="#6b4435" stroke-width="2"/>
<text x="72" y="136" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#f07a68">01 · HEADPHONES</text>
