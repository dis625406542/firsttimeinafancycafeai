<circle cx="0" cy="0" r="54" fill="#e8b89a"/>
<path d="M-56 0c0-34 24-56 56-56s56 22 56 56" stroke="#1b0f0b" stroke-width="12" fill="none" stroke-linecap="round"/>
<rect x="-70" y="-14" width="22" height="42" rx="10" fill="#1b0f0b"/>
<rect x="48" y="-14" width="22" height="42" rx="10" fill="#1b0f0b"/>
</g>
<text x="72" y="292" font-size="24" fill="#cfb3a2">One person is lost in music.</text>
</g>
<g>
<rect x="616" y="96" width="536" height="242" rx="18" fill="url(#panel)" stroke="#6b4435" stroke-width="2"/>
<text x="640" y="136" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#f07a68">02 · THE GLANCE</text>
<g transform="translate(958 238)">
<circle cx="0" cy="0" r="54" fill="#f0c4a8"/>
<path d="M-56-10c0-34 24-56 56-56s56 22 56 56c-14-14-32-22-56-22s-42 8-56 22Z" fill="#a94e2f"/>
<path d="M-24 0c4-4 8-4 12 0M12 0c4-4 8-4 12 0" stroke="#2a1813" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M42-18c12-6 24-6 34 0" stroke="#e0b56f" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="4 7"/>
</g>
<text x="640" y="292" font-size="24" fill="#cfb3a2">A sideways glance changes the room.</text>
</g>
<g>
<rect x="48" y="356" width="536" height="242" rx="18" fill="url(#panel)" stroke="#6b4435" stroke-width="2"/>
<text x="72" y="396" font-family="Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#f07a68">03 · THE LINE</text>
<g transform="translate(390 498)">
<rect x="-150" y="-78" width="300" height="70" rx="18" fill="#fff4e8"/>
<path d="M-60-8l-12 26 34-26Z" fill="#fff4e8"/>
<text x="-126" y="-32" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#4a1f28">I love the Smiths.</text>
<circle cx="0" cy="42" r="40" fill="#f0c4a8"/>
</g>
<text x="72" y="552" font-size="24" fill="#cfb3a2">One line turns a stranger into a story.</text>
</g>
<g>
<rect x="616" y="356" width="536" height="242" rx="18" fill="url(#panel)" stroke="#6b4435" stroke-width="2"/>
